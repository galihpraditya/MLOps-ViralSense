name: MLOps "Code as a Trigger" Automation Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'train.py'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'train.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # =========================================================================
  # TAHAP 1: AUTOMATED TESTING (CODE INTEGRITY GATE)
  # =========================================================================
  automated-testing:
    name: 🧪 Tahap 1 - Automated Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Run Pytest Suite (Unit & Pipeline Verification)
        env:
          PYTHONPATH: .
        run: |
          echo "Menjalankan suite pengujian kode terotomatisasi..."
          pytest -v tests/ --durations=5

  # =========================================================================
  # TAHAP 2 - 4: RETRAINING, BENCHMARK VALIDATION & AUTO-REGISTRY STAGING
  # =========================================================================
  continuous-training-and-registry:
    name: 🚀 Tahap 2-4 - Retraining, Evaluation & Registry
    needs: [automated-testing]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------------------
      # TAHAP 2: AUTOMATED TRAINING (DVC DATA SYNC & TRAIN.PY)
      # ---------------------------------------------------------------------
      - name: 🗄️ Configure DVC & Sync Dataset Lineage
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "=== Sinkronisasi Data DVC ==="
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "Kredensial R2 terdeteksi di GitHub Secrets. Mengonfigurasi remote storage DVC..."
            dvc config --local remote.r2-storage.access_key_id "$R2_ACCESS_KEY_ID"
            dvc config --local remote.r2-storage.secret_access_key "$R2_SECRET_ACCESS_KEY"
            dvc pull || echo "Peringatan: Gagal melakukan dvc pull penuh, menggunakan cache lokal/git."
          else
            echo "Kredensial DVC remote tidak diatur di Secrets. Memvalidasi integritas dataset lokal..."
          fi
          
          # Pastikan file processed dataset tersedia
          ls -la data/processed/

      - name: 🏋️ Tahap 2 - Eksekusi Automated Retraining (train.py)
        env:
          PYTHONPATH: .
        run: |
          echo "Memulai pelatihan ulang otomatis dipicu oleh event pemicu kode (Code as a Trigger)..."
          python train.py
          ls -la models/

      # ---------------------------------------------------------------------
      # TAHAP 3 & 4: EVALUATION AGAINST LK-01 THRESHOLDS & AUTO-REGISTRY
      # ---------------------------------------------------------------------
      - name: ⚖️ Tahap 3 & 4 - Model Evaluation & MLflow Registry (Staging)
        env:
          PYTHONPATH: .
        run: |
          echo "Menjalankan evaluasi otomatis terhadap ambang batas performa LK-01..."
          python src/models/evaluate.py
          
          # Tampilkan ringkasan pada GitHub Actions Step Summary
          if [ -f "models/evaluation_report.md" ]; then
            cat models/evaluation_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Tahap 4 (Lanjutan) - Verifikasi Inferensi Model Staging
        env:
          PYTHONPATH: .
        run: |
          echo "Memvalidasi kesiapan inferensi real-time model yang baru dipromosikan ke Staging..."
          python src/models/verify_inference.py --stage Staging

      # ---------------------------------------------------------------------
      # ARTIFACT PERSISTENCE
      # ---------------------------------------------------------------------
      - name: 📤 Upload Evaluation Report & Model Metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viralsense-evaluation-artifacts
          path: |
            models/candidate_run.json
            models/evaluation_report.json
            models/evaluation_report.md
            models/model_metadata.json
          retention-days: 14
