# Konfigurasi Pipeline MLOps - ViralSense
pipeline:
  name: "viralsense-data-pipeline"
  version: "1.1.0"
  timezone: "Asia/Jakarta"

data_sources:
  youtube:
    enabled: true
    region_code: "ID"
    include_trending_chart: true
    min_view_count: 5000 # Menolak video 0 views agar hanya menangkap yang benar-benar viral/menuju viral
    queries:
      - "shorts viral indonesia"
      - "shorts ngakak viral indonesia"
      - "shorts kuliner viral indonesia"
      - "racun shopee viral #shorts"
      - "ide konten viral indonesia #shorts"
      - "tips bisnis viral #shorts"
      - "podcast viral indonesia #shorts"      
      - "game viral indonesia #shorts"          
      - "horor misteri viral #shorts"  
    max_results_per_query: 25
    quota_limit_per_day: 10000

storage:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  clean_data_path: "data/processed/clean_videos.parquet"
  features_data_path: "data/processed/features_matrix.parquet"

cleaning:
  max_video_duration_seconds: 60  # Batas durasi format short-form
  min_view_count: 10
  deduplicate_keys:
    - "platform"
    - "video_id"

features:
  velocity_window_hours_default: 24
  virality_percentile_threshold: 0.90 # Top 10% diklasifikasikan viral
  min_engagement_denominator: 1

versioning:
  dvc_remote: "r2-storage"
  version_prefix: "data-v"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "viralsense-virality-prediction"
  artifact_location: "./mlruns"
  registered_model_name: "ViralSense-ViralityClassifier"

model_training:
  model_type: "gbm" # "gbm", "rf", "svm", "lr"
  test_size: 0.2
  random_state: 42
  target_column: "is_viral"
  feature_columns:
    - "duration_seconds"
    - "video_age_hours"
    - "engagement_rate"
    - "comment_to_like_ratio"
    - "caption_length"
    - "word_count"
    - "has_hook_question"
  hyperparameters:
    n_estimators: 220
    learning_rate: 0.04
    max_depth: 4
    subsample: 0.85
    random_state: 42

# Ambang Batas Evaluasi & Kriteria Keberhasilan (Sesuai LK-01 Tabel 4.1)
evaluation:
  thresholds:
    min_accuracy: 0.82       # LK-01: Akurasi >= 82% (0.82)
    min_f1_score: 0.80       # LK-01: Macro F1-Score >= 0.80
    max_latency_ms: 200.0    # LK-01: Latensi Inferensi < 200 ms (p95)
    min_roc_auc: 0.85        # Ambang batas pemisahan kelas ROC-AUC
  candidate_run_path: "models/candidate_run.json"
  evaluation_report_path: "models/evaluation_report.json"
  evaluation_summary_md: "models/evaluation_report.md"
